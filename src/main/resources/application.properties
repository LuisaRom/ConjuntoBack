spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
app.security.jwt-secret=${JWT_SECRET:Q29uanVudG9SZXNpZGVuY2lhbEpXVFNlY3JldDIwMjYxMjM0NTY3ODkw}


# CONFIGURACION HIKARI (POOL DE CONEXIONES)

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.connection-test-query=SELECT 1

# CONFIGURACI0N JPA / HIBERNATE

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.connection.useUnicode=true
spring.jpa.properties.hibernate.connection.characterEncoding=UTF-8
spring.jpa.properties.hibernate.connection.charSet=UTF-8

# CONFIGURACION SERVIDOR

server.address=0.0.0.0
server.port=${PORT:8080}

# MERCADO PAGO (sandbox: Access Token TEST-... en MERCADOPAGO_ACCESS_TOKEN; Public Key solo referencia)
mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
mercadopago.public-key=${MERCADOPAGO_PUBLIC_KEY:}
# Sin variables en Render: usa RENDER_EXTERNAL_URL (ej. https://conjuntoback.onrender.com)
app.frontend.base-url=${FRONTEND_BASE_URL:${RENDER_EXTERNAL_URL:https://conjuntoback.onrender.com}}
app.backend.base-url=${BACKEND_BASE_URL:${RENDER_EXTERNAL_URL:https://conjuntoback.onrender.com}}
spring.messages.encoding=UTF-8
spring.sql.init.encoding=UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.tomcat.uri-encoding=UTF-8
server.tomcat.connection-timeout=90s
spring.mvc.async.request-timeout=90s
